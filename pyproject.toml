[project]
name = "nexora-ai"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
nexora = "nexora.__main__:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nexora", "nexora.cli", "nexora.core", "nexora.ingest", "nexora.detect", "nexora.memory", "nexora.ui"]
